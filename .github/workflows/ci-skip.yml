name: ci

# Counterpart to ci.yml: when a change can't affect the image, report the
# required `build` and `test` checks as passed without building anything.
# Keep the path list identical to the one in ci.yml.
on:
  push:
    branches:
      - main
    paths-ignore:
      - Dockerfile
      - docker-bake.hcl
      - .github/workflows/ci.yml
  pull_request:
    branches:
      - main
    paths-ignore:
      - Dockerfile
      - docker-bake.hcl
      - .github/workflows/ci.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "No image-affecting changes; skipping build."
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "No image-affecting changes; skipping tests."
