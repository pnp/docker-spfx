name: Image Build and Push

on:
  push:
    # Release a new SPFx version when a merge to main changes the Dockerfile.
    # The version is read from the Dockerfile; if its vX.Y.Z tag doesn't exist
    # yet, the image is built and pushed, then the tag is created.
    branches:
      - main
    paths:
      - Dockerfile
    # Re-release an existing version by pushing its vX.Y.Z tag by hand.
    # The paths filter is not evaluated for tag pushes.
    tags:
      - '*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: DockerHubProd
    permissions:
      contents: write
    steps:
      # For building the image we need to checkout the source code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Work out which version to publish and whether anything needs doing
      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            git_tag_name="$GITHUB_REF_NAME";
            echo "Triggered by tag '$git_tag_name'.";
            create_tag=false;
          else
            version=$(grep -oE 'generator-sharepoint@[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | cut -d@ -f2);
            git_tag_name="v$version";
            echo "Dockerfile declares SPFx $version.";
            if git ls-remote --exit-code --tags origin "refs/tags/$git_tag_name" >/dev/null; then
              echo "Tag '$git_tag_name' already exists; nothing to release.";
              echo "release=false" >> "$GITHUB_OUTPUT";
              exit 0;
            fi;
            create_tag=true;
          fi;
          echo "Verifying that the tag name matches the expected format...";
          if [[ ! "$git_tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag name '$git_tag_name' does not match the expected format 'vX.Y.Z'.";
            exit 1;
          fi;
          docker_image_tag_name=${git_tag_name:1};
          echo "docker_image_tag_name: $docker_image_tag_name";
          echo "release=true" >> "$GITHUB_OUTPUT";
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT";
          echo "git_tag_name=$git_tag_name" >> "$GITHUB_OUTPUT";
          echo "docker_image_tag_name=$docker_image_tag_name" >> "$GITHUB_ENV";

      # Set up Docker Buildx for multiplatform builds
      - name: Set up Docker Buildx
        if: steps.version.outputs.release == 'true'
        uses: docker/setup-buildx-action@v4

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        if: steps.version.outputs.release == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push multiplatform Docker image
      - name: Build multiplatform Docker image
        if: steps.version.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ${{ vars.DOCKER_ORG }}/spfx:${{ env.docker_image_tag_name }}
            ${{ vars.DOCKER_ORG }}/spfx:latest
            ${{ vars.DOCKER_ORG }}/spfx:online
          target: default

      # Tag the merge commit once the image is on Docker Hub, so an existing
      # tag always means a published image. A tag pushed with GITHUB_TOKEN
      # does not re-trigger this workflow.
      - name: Create release tag
        if: steps.version.outputs.create_tag == 'true'
        run: |
          git tag "${{ steps.version.outputs.git_tag_name }}";
          git push origin "${{ steps.version.outputs.git_tag_name }}";
