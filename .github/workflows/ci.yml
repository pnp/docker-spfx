name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # The image depends only on the files listed below (the Dockerfile has no
  # COPY/ADD), so other changes skip the build. The build and test jobs are
  # skipped with a job-level `if`, which GitHub reports as a passing required
  # check, so docs-only PRs stay mergeable without a multiplatform build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - Dockerfile
              - docker-bake.hcl
              - .github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.image == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
        with:
            cleanup: false
      - uses: docker/bake-action@v7.3.0
        with:
          source: .
          targets: default
          push: false
          set: |
            *.cache-from=type=gha,scope=dockerspfx
            *.cache-to=type=gha,scope=dockerspfx,mode=max

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false
      - uses: docker/bake-action@v7.3.0
        with:
          source: .
          targets: test
          push: false
          set: |
            *.cache-from=type=gha,scope=dockerspfx
            *.cache-to=type=gha,scope=dockerspfx,mode=max
