name: ci

# The image depends only on these files (the Dockerfile has no COPY/ADD), so
# other changes skip the build. ci-skip.yml reports the same required checks
# as passed for those changes. Keep both path lists identical.
on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker-bake.hcl
      - .github/workflows/ci.yml
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - docker-bake.hcl
      - .github/workflows/ci.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
        with:
            cleanup: false
      - uses: docker/bake-action@v7.3.0
        with:
          source: .
          targets: default
          push: false
          set: |
            *.cache-from=type=gha,scope=dockerspfx
            *.cache-to=type=gha,scope=dockerspfx,mode=max

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false
      - uses: docker/bake-action@v7.3.0
        with:
          source: .
          targets: test
          push: false
          set: |
            *.cache-from=type=gha,scope=dockerspfx
            *.cache-to=type=gha,scope=dockerspfx,mode=max
